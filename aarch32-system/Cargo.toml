[package]
name = "rax-aarch32-system"
version = "0.1.0"
edition = "2024"
description = "Block execution engine for ARMv7-A system emulation on the RAX AArch32 core"
license = "MIT"
repository = "https://github.com/HexRaysSA/rax"
readme = "README.md"

[features]
default = ["jit"]
# The compiler from blocks to host code. It exists only on AArch64 macOS and Linux: with
# another host, or with no feature, the engine has the fast interpreter only.
jit = []

[dependencies]
rax = { path = "..", default-features = false }

# The compiler maps its code with mmap.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "macos", target_os = "linux")))'.dependencies]
libc = "0.2"
